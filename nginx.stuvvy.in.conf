# Nginx Reverse Proxy Configuration for stuvvy.in
# Place in: /etc/nginx/sites-available/stuvvy.in
# Symlink: ln -s /etc/nginx/sites-available/stuvvy.in /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name stuvvy.in www.stuvvy.in;

    # Certbot ACME challenge location (for SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS once SSL certificate is installed
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stuvvy.in www.stuvvy.in;

    # SSL Certificates (managed via Certbot: sudo certbot --nginx -d stuvvy.in -d www.stuvvy.in)
    # ssl_certificate /etc/letsencrypt/live/stuvvy.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stuvvy.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Gzip compression for high performance
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
